<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">Alisa 当前 Kubernetes 集群组件拓扑</title><desc id="desc">单节点 kind 集群，分为控制面、节点运行网络、平台与业务组件。公网经 Caddy 和 Traefik，另有 Contour Envoy 入口。服务发现与存储分别由 Nacos、Redis 和 SeaweedFS 提供。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="1120" height="800" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" fill="#172554"><text x="32" y="42" font-size="23" font-weight="700">Alisa · 当前 Kubernetes 组件拓扑</text><text x="32" y="69" font-size="14" fill="#475569">2026-11-08 核验 · 单节点 kind-control-plane · Node 10.89.0.2</text><rect x="32" y="96" width="1056" height="86" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="49" y="125" font-size="17" font-weight="650">公网入口</text><text x="49" y="153" font-size="13" fill="#334155">cpolar → Windows Caddy → Traefik / HTTPRoute → Service → Pod</text><rect x="32" y="214" width="330" height="206" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="49" y="243" font-size="17" font-weight="650">Kubernetes 控制面</text><text x="49" y="271" font-size="13" fill="#334155">kube-apiserver：集群 API</text><text x="49" y="295" font-size="13" fill="#334155">etcd：保存对象与状态</text><text x="49" y="319" font-size="13" fill="#334155">controller-manager：控制循环</text><text x="49" y="343" font-size="13" fill="#334155">scheduler：给 Pod 分配节点</text><text x="49" y="367" font-size="13" fill="#334155">kubectl / Argo CD 通过 API 操作</text><rect x="394" y="214" width="330" height="206" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="411" y="243" font-size="17" font-weight="650">节点运行、网络与寻址</text><text x="411" y="271" font-size="13" fill="#334155">kubelet → containerd：运行容器</text><text x="411" y="295" font-size="13" fill="#334155">kindnet：Pod 网络</text><text x="411" y="319" font-size="13" fill="#334155">kube-proxy：Service 网络规则</text><text x="411" y="343" font-size="13" fill="#334155">CoreDNS × 2：集群 DNS</text><text x="411" y="367" font-size="13" fill="#334155">local-path：节点本地持久化卷</text><rect x="756" y="214" width="332" height="206" rx="12" fill="#ede9fe" stroke="#cbd5e1"/><text x="773" y="243" font-size="17" font-weight="650">入口控制与外部地址</text><text x="773" y="271" font-size="13" fill="#334155">MetalLB：分配、宣告 LB 地址</text><text x="773" y="295" font-size="13" fill="#334155">Traefik：10.89.0.201</text><text x="773" y="319" font-size="13" fill="#334155">  当前 /docs /science /网关入口</text><text x="773" y="343" font-size="13" fill="#334155">Contour + Envoy：10.89.0.212</text><text x="773" y="367" font-size="13" fill="#334155">  另有现存入口，勿混用路由</text><rect x="32" y="452" width="330" height="206" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="49" y="481" font-size="17" font-weight="650">交付控制面 · argocd</text><text x="49" y="509" font-size="13" fill="#334155">server / repo-server</text><text x="49" y="533" font-size="13" fill="#334155">application-controller</text><text x="49" y="557" font-size="13" fill="#334155">ApplicationSet / notifications</text><text x="49" y="581" font-size="13" fill="#334155">Dex / 内部 Redis</text><text x="49" y="605" font-size="13" fill="#334155">Git → 清单 → API Server → 就绪</text><rect x="394" y="452" width="330" height="206" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="411" y="481" font-size="17" font-weight="650">应用与业务</text><text x="411" y="509" font-size="13" fill="#334155">alisa-gateway / alisa-user</text><text x="411" y="533" font-size="13" fill="#334155">Portal Web + Go API / Docs</text><text x="411" y="557" font-size="13" fill="#334155">Science Web + community + transfer</text><text x="411" y="581" font-size="13" fill="#334155">Nacos：发现与动态配置</text><text x="411" y="605" font-size="13" fill="#334155">业务 Redis：验证码等临时状态</text><rect x="756" y="452" width="332" height="206" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="773" y="481" font-size="17" font-weight="650">数据、对象与文件</text><text x="773" y="509" font-size="13" fill="#334155">SeaweedFS：master / volume</text><text x="773" y="533" font-size="13" fill="#334155">  filer / s3 / webdav / admin</text><text x="773" y="557" font-size="13" fill="#334155">业务 MySQL：公网 TCP 14681</text><text x="773" y="581" font-size="13" fill="#334155">Portal data PVC / 构建缓存 PVC</text><text x="773" y="605" font-size="13" fill="#334155">etcd 不保存业务库或文件备份</text><path d="M196 182 L196 211" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M560 182 L560 211" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M922 182 L922 211" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M196 452 L196 423" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M560 420 L560 449" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M724 555 L753 555" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="32" y="706" font-size="15" font-weight="650">服务寻址：Kubernetes Service DNS ≠ Nacos 注册名 ≠ 公网 URL</text><text x="32" y="734" font-size="13" fill="#475569">单节点的多个 Pod 副本不等于跨节点容灾；local-path / S3 / MySQL / etcd 的备份范围不同。</text><text x="32" y="763" font-size="12" fill="#64748b">逻辑职责图；实际服务地址与当前组件清单请结合正文，不将临时 Pod IP 写入配置。</text></g></svg>