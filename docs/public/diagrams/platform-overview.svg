<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc"><title id="title">Alisa 平台分层与入口分流</title><desc id="desc">客户端经 cpolar、Caddy 和 Traefik。Traefik 将业务 API 交给 Spring Cloud Gateway，门户和管理界面可独立分流。业务服务按需使用 Nacos、MySQL、Redis、S3 和 SMTP；底层使用关系详见正文表。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526d82"/></marker></defs><rect width="1280" height="790" rx="18" fill="#f5f8fb"/><style>text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#20384d}.caption{font-size:14px;fill:#526d82}.name{font-size:18px;font-weight:650}.small{font-size:13px;fill:#526d82}.edge{fill:none;stroke:#526d82;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="36" y="35" class="name">请求入口：公网接入与集群路由</text>
<rect x="36" y="62" width="205" height="88" rx="10" fill="#fff" stroke="#c8d5df"/>
<text class="name" x="52" y="91">客户端</text>
<text class="small" x="52" y="115">移动端 / Web / SDK</text>
<rect x="276" y="62" width="205" height="88" rx="10" fill="#fff" stroke="#c8d5df"/>
<text class="name" x="292" y="91">cpolar</text>
<text class="small" x="292" y="115">公网接入 / 内网穿透</text>
<rect x="516" y="62" width="205" height="88" rx="10" fill="#fff" stroke="#c8d5df"/>
<text class="name" x="532" y="91">Caddy</text>
<text class="small" x="532" y="115">路径、Host 与 TLS</text>
<rect x="756" y="62" width="205" height="88" rx="10" fill="#fff" stroke="#c8d5df"/>
<text class="name" x="772" y="91">Traefik</text>
<text class="small" x="772" y="115">Gateway API / HTTPRoute</text>
<path class="edge" d="M241 106 H276"/>
<path class="edge" d="M481 106 H516"/>
<path class="edge" d="M721 106 H756"/>
<rect x="36" y="236" width="330" height="98" rx="10" fill="#e3f2ef" stroke="#c8d5df"/>
<text class="name" x="52" y="265">Spring Cloud Gateway</text>
<text class="small" x="52" y="289">业务 API：认证与动态路由</text>
<text class="small" x="52" y="310">本地账号路由 + Nacos 业务路由</text>
<rect x="446" y="236" width="330" height="98" rx="10" fill="#fff" stroke="#c8d5df"/>
<text class="name" x="462" y="265">Portal / 文档等应用入口</text>
<text class="small" x="462" y="289">独立的应用和认证边界</text>
<text class="small" x="462" y="310">不自动经过业务 JWT 网关</text>
<rect x="856" y="236" width="370" height="98" rx="10" fill="#fff" stroke="#c8d5df"/>
<text class="name" x="872" y="265">运维与存储协议入口</text>
<text class="small" x="872" y="289">Argo CD / Nacos / Registry 等</text>
<text class="small" x="872" y="310">各自认证；按环境配置分流</text>
