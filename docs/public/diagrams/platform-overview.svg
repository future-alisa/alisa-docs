<text class="caption" x="36" y="741">部署控制面：Git → 构建 / 测试 → Registry → 部署 Git → Argo CD → Kubernetes</text><text class="small" x="36" y="766">逻辑职责图 · 不代表实时运行状态 · Portal 管理令牌、业务 JWT 与存储签名分别管理</text></svg>