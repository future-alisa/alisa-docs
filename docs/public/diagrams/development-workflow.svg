<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1020" role="img" aria-labelledby="title desc"><title id="title">标准开发与发布工作流</title><desc id="desc">GitHub Flow：需求、短期分支、开发测试、PR评审、合入主线并清理分支。平台GitOps：发布准备、Argo CD同步、就绪和业务验证、记录完成。评审未通过返回开发，发布验证失败进入回滚后重新发布。</desc><defs><marker id="ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker><marker id="retry" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b45309"/></marker></defs><rect width="1120" height="1020" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,'Noto Sans CJK SC',sans-serif" fill="#172554"><text x="36" y="44" font-size="27" font-weight="700">标准开发与发布工作流</text><text x="36" y="74" font-size="15" fill="#475569">一个长期主线 main · 短期任务分支 · 检查与评审 · 可追溯发布</text><rect x="24" y="102" width="1072" height="354" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="44" y="136" font-size="19" font-weight="650">开发协作 · GitHub Flow</text><rect x="24" y="492" width="1072" height="440" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/><text x="44" y="526" font-size="19" font-weight="650">部署与运维 · 本平台 GitOps 扩展</text><rect x="44" y="166" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="62" y="195" font-size="19" font-weight="650">1 · 需求与验收</text><text x="62" y="221" font-size="14" fill="#334155">明确场景、范围和验证结果</text><text x="62" y="241" font-size="14" fill="#334155">关联任务或 Issue</text><rect x="404" y="166" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="422" y="195" font-size="19" font-weight="650">2 · 创建短期分支</text><text x="422" y="221" font-size="14" fill="#334155">从最新 main 开始</text><text x="422" y="241" font-size="14" fill="#334155">feature/ · fix/ · docs/ 等</text><rect x="764" y="166" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="782" y="195" font-size="19" font-weight="650">3 · 开发与本地验证</text><text x="782" y="221" font-size="14" fill="#334155">小批量修改、相关测试、构建</text><text x="782" y="241" font-size="14" fill="#334155">同步接口、权限与文档</text><rect x="764" y="336" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="782" y="365" font-size="19" font-weight="650">4 · PR、CI 与评审</text><text x="782" y="391" font-size="14" fill="#334155">说明问题、结果和发布影响</text><text x="782" y="411" font-size="14" fill="#334155">通过检查并处理评审反馈</text><rect x="404" y="336" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="422" y="365" font-size="19" font-weight="650">5 · 合入 main</text><text x="422" y="391" font-size="14" fill="#334155">主线保持可发布</text><text x="422" y="411" font-size="14" fill="#334155">记录准确源码提交</text><rect x="44" y="336" width="280" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="62" y="365" font-size="19" font-weight="650">清理短期分支</text><text x="62" y="391" font-size="14" fill="#334155">确认已合入且无人继续依赖</text><text x="62" y="411" font-size="14" fill="#334155">删除本地与远端任务分支</text><path d="M324 211H402" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path d="M684 211H762" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path d="M842 256V334" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path d="M764 381H686" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><text x="712" y="369" font-size="13" fill="#475569">通过</text><path d="M404 381H326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path d="M1044 381H1070V285H980V258" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#retry)"/><text x="865" y="302" font-size="13" fill="#b45309">未通过：返回修改</text><rect x="404" y="562" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="422" y="591" font-size="19" font-weight="650">6 · 发布准备</text><text x="422" y="617" font-size="14" fill="#334155">固定源码与镜像版本</text><text x="422" y="637" font-size="14" fill="#334155">更新 Git 中的部署清单</text><rect x="764" y="562" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="782" y="591" font-size="19" font-weight="650">7 · Argo CD 同步</text><text x="782" y="617" font-size="14" fill="#334155">按应用配置执行 Hook（如有）</text><text x="782" y="637" font-size="14" fill="#334155">同步工作负载与配置</text><rect x="764" y="738" width="280" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="782" y="767" font-size="19" font-weight="650">8 · 就绪与业务验证</text><text x="782" y="793" font-size="14" fill="#334155">核对版本、探针、入口与权限</text><text x="782" y="813" font-size="14" fill="#334155">验证实际业务与拒绝场景</text><rect x="404" y="738" width="280" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="422" y="767" font-size="19" font-weight="650">9 · 记录并完成</text><text x="422" y="793" font-size="14" fill="#334155">保存版本、环境和验证结果</text><text x="422" y="813" font-size="14" fill="#334155">更新文档、入口与遗留问题</text><rect x="44" y="738" width="280" height="90" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="62" y="767" font-size="19" font-weight="650">定位与回滚</text><text x="62" y="793" font-size="14" fill="#334155">恢复上一有效镜像/配置/路由</text><text x="62" y="813" font-size="14" fill="#334155">数据变更按专门恢复方案</text><path d="M544 426V560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><text x="558" y="477" font-size="13" fill="#475569">进入发布流程</text><path d="M684 607H762" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path d="M904 652V736" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><path d="M764 783H686" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><text x="712" y="770" font-size="13" fill="#475569">通过</text><path d="M904 828V886H184V830" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#retry)"/><text x="410" y="910" font-size="13" fill="#b45309">未通过：按问题类型恢复</text><path d="M184 738V607H402" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#retry)"/><text x="236" y="592" font-size="13" fill="#b45309">重新发布</text><text x="36" y="965" font-size="14" fill="#334155">说明：GitHub Flow 不强制分支前缀、Argo CD 或每次合入立即上线；构建时点以项目流水线为准。</text><text x="36" y="993" font-size="13" fill="#64748b">实线为正常流程，橙色虚线为失败处理。镜像回滚不会自动恢复数据库、对象文件或 PVC。</text></g></svg>