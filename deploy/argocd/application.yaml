apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alisa-docs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/future-alisa/alisa-docs.git"
    targetRevision: "main"
    path: deploy/production
  destination:
    server: https://kubernetes.default.svc
    namespace: alisa-infra
  revisionHistoryLimit: 5
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: alisa-docs-registry-auth
      namespace: alisa-infra
      jsonPointers: [/data]
  syncPolicy:
    syncOptions: [RespectIgnoreDifferences=true]
