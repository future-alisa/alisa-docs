apiVersion: batch/v1
kind: Job
metadata:
  name: alisa-docs-registry-check-tls
  namespace: alisa-infra
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      dnsPolicy: Default
      containers:
      - name: check
        image: node:22-alpine
        imagePullPolicy: IfNotPresent
        command:
        - node
        - -e
        - const https=require('https');const u='https://registry.kind.internal:5000/v2/';const
          r=https.get(u,{rejectUnauthorized:false,family:4,timeout:12000},s=>{console.log('INTERNAL_TLS_STATUS',s.statusCode);s.resume()});r.on('timeout',()=>r.destroy(new
          Error('timeout')));r.on('error',e=>console.log('ERROR',e.message));setTimeout(()=>process.exit(0),15000);
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
