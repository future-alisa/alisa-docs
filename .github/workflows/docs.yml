name: Validate documentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build source archive mode under subpath
        run: npm run build
        env:
          DOCS_ARCHIVE_BUILD: 'true'
          DOCS_BASE: /docs/
